name: Test and Lint
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      # Fails if total coverage, counting branches, drops below this minimum:
      # the measured figure, rounded down. Raise it as coverage improves.
      - run: uv run pytest tests --cov-fail-under=87
  lowest-deps:
    # The oldest versions pyproject.toml allows, on the oldest supported Python,
    # so a change that needs a newer library fails here instead of for users
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
      - run: uv sync --resolution lowest-direct
      - run: uv pip list --python .venv/bin/python
      - run: uv run --no-sync pytest tests --no-cov
