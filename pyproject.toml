[project]
name = "codeatlas"
version = "0.1.0"
description = "Generate comprehensive documentation for Python codebases using LLMs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Arjun Urs" }
]
keywords = ["documentation", "code analysis", "llm", "ai", "documentation generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "jinja2>=3.0.0",
    "python-dotenv>=1.0.0",
    "markdown>=3.5",
    "nh3>=0.3.0",
]

[project.scripts]
codeatlas = "docgen.cli:main"
docgen = "docgen.cli:main"

[project.urls]
Homepage = "https://github.com/arjunurs/codeatlas"
Repository = "https://github.com/arjunurs/codeatlas"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docgen"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "ty>=0.0.14",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --cov=docgen --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "BLE", "RUF", "SIM"]
ignore = ["E501"]
