repos:
  # File hygiene checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-added-large-files

  # Ruff and ty run through uv, so they use the versions in uv.lock: the same
  # ones CI uses
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Non-blocking: ty is early (0.0.x) and has false positives, so it reports
      # but never fails a commit
      - id: ty-check
        name: ty type check (non-blocking)
        entry: bash -c 'uv run ty check || true'
        language: system
        types: [python]
        pass_filenames: false
        verbose: true
        files: ^src/
