<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ title }}{% if project and title != project %} · {{ project }}{% endif %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
            --header-height: 56px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
        }

        /* Skip to content link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #1a1a1a;
            color: white;
            padding: 8px 16px;
            z-index: 1000;
            text-decoration: none;
        }
        .skip-link:focus {
            top: 0;
        }

        /* Mobile header */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 16px;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .mobile-menu-btn {
            background: none;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .mobile-menu-btn:hover {
            background: #f3f4f6;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            overflow-y: auto;
            background: #fafafa;
            border-right: 1px solid #e5e7eb;
            padding: 16px;
            z-index: 40;
        }

        .sidebar-header {
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin: 0;
        }

        .page-subtitle {
            color: #6b7280;
            font-size: 14px;
            margin: 4px 0 24px 0;
        }

        /* Navigation */
        .nav-section {
            margin-bottom: 20px;
        }
        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            padding: 8px 0;
            margin: 0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 6px;
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .nav-item:hover {
            background: #e5e7eb;
        }
        .nav-item.active {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 500;
        }
        .nav-item i {
            width: 16px;
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
        }

        /* Main content */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 24px 32px;
            min-height: 100vh;
            max-width: 1200px;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .breadcrumbs a {
            color: #6b7280;
            text-decoration: none;
        }
        .breadcrumbs a:hover {
            color: #374151;
            text-decoration: underline;
        }
        .breadcrumbs .separator {
            color: #d1d5db;
        }
        .breadcrumbs .current {
            color: #374151;
            font-weight: 500;
        }

        /* Content cards */
        .content-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .content-card h1 {
            font-size: 28px;
            font-weight: 600;
            color: #111827;
            margin: 0 0 16px 0;
            line-height: 1.3;
        }

        .content-card h2 {
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            margin: 24px 0 12px 0;
        }

        /* Diagram container */
        .diagram-container {
            width: 100%;
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: white;
            position: relative;
        }

        .diagram-toolbar {
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            z-index: 10;
        }

        .diagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: #374151;
        }
        .diagram-btn:hover {
            background: #f3f4f6;
        }
        .diagram-btn:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .diagram-content {
            padding: 16px;
            display: inline-block;
            min-width: 100%;
        }

        .mermaid {
            display: inline-block;
        }

        .mermaid svg {
            display: block;
        }

        /* Footer navigation */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
        }
        .footer-nav-link {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            text-decoration: none;
            color: #374151;
            max-width: 45%;
            transition: border-color 0.15s, background 0.15s;
        }
        .footer-nav-link:hover {
            border-color: #3b82f6;
            background: #f0f9ff;
        }
        .footer-nav-link.next {
            text-align: right;
            margin-left: auto;
        }
        .footer-nav-label {
            font-size: 12px;
            color: #6b7280;
        }
        .footer-nav-title {
            font-size: 14px;
            font-weight: 500;
        }

        /* Sidebar overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 35;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                top: var(--header-height);
                height: calc(100vh - var(--header-height));
            }
            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.open {
                display: block;
            }

            .main-content {
                margin-left: 0;
                padding: 16px;
                padding-top: calc(var(--header-height) + 16px);
            }

            .footer-nav {
                flex-direction: column;
            }
            .footer-nav-link {
                max-width: 100%;
            }
            .footer-nav-link.next {
                text-align: left;
            }
        }

        /* Keyboard shortcut hints */
        .kbd {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            font-family: monospace;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            color: #6b7280;
        }

        /* Focus visible for keyboard navigation */
        :focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        /* Print styles */
        @media print {
            .sidebar, .mobile-header, .diagram-toolbar, .footer-nav {
                display: none !important;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
    <script>
        // Mermaid configuration
        mermaid.initialize({
            startOnLoad: true,
            theme: 'default',
            securityLevel: 'strict',
            maxTextSize: 100000,
            fontSize: 14,
            flowchart: {
                useMaxWidth: false,
                htmlLabels: true,
                curve: 'basis'
            },
            sequence: {
                useMaxWidth: false,
                showSequenceNumbers: true
            }
        });

        // Mobile menu toggle
        function toggleMobileMenu() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('open');
        }

        // Close mobile menu when clicking overlay
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.querySelector('.sidebar-overlay');
            if (overlay) {
                overlay.addEventListener('click', toggleMobileMenu);
            }

            // Close mobile menu on escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const sidebar = document.querySelector('.sidebar');
                    if (sidebar && sidebar.classList.contains('open')) {
                        toggleMobileMenu();
                    }
                }
            });
        });

        // Diagram zoom functionality
        let diagramScale = 1;
        let originalSvgWidth = 0;
        let originalSvgHeight = 0;

        function zoomDiagram(factor) {
            const content = document.querySelector('.diagram-content');
            const svg = content ? content.querySelector('svg') : null;
            if (!svg) return;

            // Store original dimensions on first call
            if (!originalSvgWidth || !originalSvgHeight) {
                const rect = svg.getBoundingClientRect();
                originalSvgWidth = rect.width;
                originalSvgHeight = rect.height;
            }

            if (factor === 'reset') {
                diagramScale = 1;
                svg.style.transform = '';
                content.style.width = '';
                content.style.height = '';
            } else if (factor === 'fit') {
                // Calculate scale to fit the diagram container
                const container = document.querySelector('.diagram-container');
                const containerRect = container.getBoundingClientRect();
                const padding = 48; // Account for content padding
                const availableWidth = containerRect.width - padding;
                const availableHeight = containerRect.height - padding;

                const scaleX = availableWidth / originalSvgWidth;
                const scaleY = availableHeight / originalSvgHeight;
                diagramScale = Math.min(scaleX, scaleY, 1);

                svg.style.transform = `scale(${diagramScale})`;
                svg.style.transformOrigin = 'top left';
                content.style.width = (originalSvgWidth * diagramScale) + 'px';
                content.style.height = (originalSvgHeight * diagramScale) + 'px';
            } else {
                diagramScale = Math.max(0.1, Math.min(3, diagramScale * factor));
                svg.style.transform = `scale(${diagramScale})`;
                svg.style.transformOrigin = 'top left';
                // Adjust container size to match scaled SVG
                content.style.width = (originalSvgWidth * diagramScale) + 'px';
                content.style.height = (originalSvgHeight * diagramScale) + 'px';
            }

            // Update zoom level display
            const zoomLevel = document.getElementById('zoom-level');
            if (zoomLevel) {
                zoomLevel.textContent = Math.round(diagramScale * 100) + '%';
            }
        }

        // Note: Diagrams render at natural size for best readability
        // Users can click "Fit" button to fit to panel if needed

        function downloadDiagram() {
            const svg = document.querySelector('.diagram-content svg');
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'diagram.svg';
            a.click();
            URL.revokeObjectURL(url);
        }

        function toggleFullscreen() {
            const container = document.querySelector('.diagram-container');
            if (!container) return;

            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Mobile header -->
    <header class="mobile-header">
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
        <span style="font-weight: 500; font-size: 14px;">{{ title }}</span>
    </header>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Sidebar -->
    <nav class="sidebar" aria-label="Main navigation">
        <div class="sidebar-header">
            <h1 class="sidebar-title">{{ project or "Documentation" }}</h1>
        </div>

        <div id="navigation">
            {{ navigation | safe }}
        </div>
    </nav>

    <!-- Main content -->
    <main id="main-content" class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
