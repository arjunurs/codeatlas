<nav aria-label="Documentation navigation">
    <div class="nav-section">
        <a href="{{ base_url }}index.html"
           class="nav-item {% if active == 'index' %}active{% endif %}"
           {% if active == 'index' %}aria-current="page"{% endif %}>
            <i class="fas fa-home" aria-hidden="true"></i>
            <span>Home</span>
        </a>
    </div>

    {% if sections %}
    <div class="nav-section">
        <h2 class="nav-section-title">Documentation</h2>
        {% for section in sections %}
        <a href="{{ base_url }}sections/{{ section | lower | replace(' ', '_') }}.html"
           class="nav-item {% if active == section %}active{% endif %}"
           {% if active == section %}aria-current="page"{% endif %}>
            <span>{{ section }}</span>
        </a>
        {% endfor %}
    </div>
    {% endif %}

    {% if diagrams %}
    <div class="nav-section">
        <h2 class="nav-section-title">Diagrams</h2>
        {% for diagram in diagrams %}
        <a href="{{ base_url }}diagrams/{{ diagram.page }}.html"
           class="nav-item {% if active == diagram.page %}active{% endif %}"
           {% if active == diagram.page %}aria-current="page"{% endif %}>
            <i class="fas {{ diagram.icon }}" aria-hidden="true"></i>
            <span>{{ diagram.title }}</span>
        </a>
        {% endfor %}
    </div>
    {% endif %}
</nav>
